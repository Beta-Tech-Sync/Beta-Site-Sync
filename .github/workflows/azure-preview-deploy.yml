name: SiteSync customer preview deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build web and Android preview, then deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android app
        run: dotnet restore SiteSyncTracker.csproj -p:TargetFramework=net10.0-android

      - name: Build Android preview APK
        run: >-
          dotnet publish SiteSyncTracker.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          -p:AndroidPackageFormat=apk

      - name: Add APK to public download page
        shell: bash
        run: |
          set -euo pipefail
          apk_path=$(find bin/Release/net10.0-android -type f -name '*-Signed.apk' -print -quit)
          test -n "$apk_path"
          mkdir -p Web/wwwroot/downloads
          cp "$apk_path" Web/wwwroot/downloads/sitesync-android-preview.apk

      - name: Publish web application
        run: dotnet publish Web/SiteSyncTracker.Web.csproj --configuration Release --output ./publish

      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-customer-preview
          path: |
            publish/**
            Web/wwwroot/downloads/sitesync-android-preview.apk
          if-no-files-found: error

      - name: Sign in to Azure with GitHub
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy customer preview
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
