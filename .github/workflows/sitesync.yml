name: SiteSync Release Validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    name: API and inventory tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test shared inventory rules
        run: node --test InventoryUi/tests/core.test.cjs
      - name: Restore test dependencies
        run: dotnet restore Web.Tests/SiteSyncTracker.Web.Tests.csproj
      - name: Run API tests
        run: dotnet test Web.Tests/SiteSyncTracker.Web.Tests.csproj --configuration Release --no-restore
      - name: Build web application
        run: dotnet build Web/SiteSyncTracker.Web.csproj --configuration Release --no-restore

  android-build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore Android target
        run: dotnet restore SiteSyncTracker.csproj -p:TargetFramework=net10.0-android
      - name: Build Android APK
        run: >-
          dotnet publish SiteSyncTracker.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          -p:AndroidPackageFormat=apk
      - name: Verify and stage APK
        shell: bash
        run: |
          apk_path=$(find bin/Release/net10.0-android -type f -name '*-Signed.apk' -print -quit)
          test -n "$apk_path"
          cp "$apk_path" SiteSyncTracker.apk
      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-android-apk
          path: SiteSyncTracker.apk
          if-no-files-found: error

  android-emulator:
    name: Android emulator smoke test
    needs: android-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v6
        with:
          name: sitesync-android-apk
          path: .
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            set -eu
            adb install -r SiteSyncTracker.apk
            adb shell pm list packages | grep com.sitesync.tracker
            adb shell monkey -p com.sitesync.tracker -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof com.sitesync.tracker
            python .github/scripts/android_preview.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-app-previews
          path: android-*.png
          if-no-files-found: warn

  windows-build:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build Windows application
        run: dotnet publish SiteSyncTracker.csproj -c Release -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:WindowsPackageType=None -p:GenerateAppxPackageOnBuild=false --self-contained true -r win-x64 -o artifacts/windows
      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-windows
          path: artifacts/windows/**/*
          if-no-files-found: error
      - name: Launch Windows app and capture previews
        shell: pwsh
        run: ./.github/scripts/windows-preview.ps1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-app-previews
          path: windows-*.png
          if-no-files-found: warn

  android-release-bundle:
    name: Build Android release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore Android target
        run: dotnet restore SiteSyncTracker.csproj -p:TargetFramework=net10.0-android
      - name: Build unsigned Android App Bundle
        run: >-
          dotnet publish SiteSyncTracker.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          -p:AndroidPackageFormat=aab
          -p:AndroidKeyStore=false
      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-android-aab
          path: bin/Release/net10.0-android/**/*.aab
          if-no-files-found: error

  kotlin-android:
    name: Kotlin Android builds and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build both Kotlin apps and run unit tests
        run: >-
          bash ./gradlew :app:assembleDebug :app-compose:assembleDebug
          :shared:testDebugUnitTest :app:testDebugUnitTest :app-compose:testDebugUnitTest
          --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-kotlin-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app-compose/build/outputs/apk/debug/*.apk
          if-no-files-found: error
