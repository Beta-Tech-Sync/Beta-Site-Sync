name: SiteSync Release Validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-container:
    name: Web tests and container smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test shared inventory rules
        run: node --test InventoryUi/tests/core.test.cjs
      - name: Restore test dependencies
        run: dotnet restore Web.Tests/SiteSyncTracker.Web.Tests.csproj
      - name: Run API tests
        run: dotnet test Web.Tests/SiteSyncTracker.Web.Tests.csproj --configuration Release --no-restore
      - name: Build web application
        run: dotnet build Web/SiteSyncTracker.Web.csproj --configuration Release --no-restore
      - name: Build container image
        run: docker build --file Web/Dockerfile --tag sitesync-tracker-web:${{ github.sha }} .
      - name: Start container for health check
        run: >-
          docker run --detach --name sitesync-ci --publish 18080:8080
          --volume sitesync-ci-data:/data
          --env ASPNETCORE_ENVIRONMENT=Production
          --env ConnectionStrings__Inventory='Data Source=/data/sitesync.db'
          --env ConnectionStrings__Identity='Data Source=/data/sitesync-auth.db'
          --env Admin__Email=ci-admin@example.com
          --env Admin__Password=ci-Only-Password-123!
          sitesync-tracker-web:${{ github.sha }}
      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/api/health; then exit 0; fi
            sleep 2
          done
          docker logs sitesync-ci
          exit 1
      - name: Stop validation container
        if: always()
        run: docker rm --force sitesync-ci

  android-build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore Android target
        run: dotnet restore SiteSyncTracker.csproj -p:TargetFramework=net10.0-android
      - name: Build Android APK
        run: >-
          dotnet publish SiteSyncTracker.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          -p:AndroidPackageFormat=apk
      - name: Verify and stage APK
        shell: bash
        run: |
          apk_path=$(find bin/Release/net10.0-android -type f -name '*-Signed.apk' -print -quit)
          test -n "$apk_path"
          cp "$apk_path" SiteSyncTracker.apk
      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-android-apk
          path: SiteSyncTracker.apk
          if-no-files-found: error

  android-emulator:
    name: Android emulator smoke test
    needs: android-build
    runs-on: ubuntu-24.04
    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v6
        with:
          name: sitesync-android-apk
          path: .
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            set -eu
            adb install -r SiteSyncTracker.apk
            adb shell pm list packages | grep com.sitesync.tracker
            adb shell monkey -p com.sitesync.tracker -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell pidof com.sitesync.tracker

  windows-build:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build Windows application
        run: dotnet publish SiteSyncTracker.csproj -c Release -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0
      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-windows
          path: bin/Release/net10.0-windows10.0.19041.0/**/AppPackages/**/*
          if-no-files-found: error

  android-release-bundle:
    name: Build Android release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore Android target
        run: dotnet restore SiteSyncTracker.csproj -p:TargetFramework=net10.0-android
      - name: Build unsigned Android App Bundle
        run: >-
          dotnet publish SiteSyncTracker.csproj
          --configuration Release
          --framework net10.0-android
          --no-restore
          -p:AndroidPackageFormat=aab
          -p:AndroidKeyStore=false
      - uses: actions/upload-artifact@v5
        with:
          name: sitesync-android-aab
          path: bin/Release/net10.0-android/**/*.aab
          if-no-files-found: error
